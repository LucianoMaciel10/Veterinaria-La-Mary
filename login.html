<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Veterinaria La Mary</title>
    <link
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/administracion.css" />
    <link rel="stylesheet" href="css/login.css" />
    <script
      src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="js/auth.js" defer></script>
    <script src="js/login.js" defer></script>
  </head>
  <body class="pagina-login">
    <main
      class="d-flex justify-content-center align-items-center min-vh-100 px-3 py-4"
    >
      <div class="login-contenedor w-100">
        <div class="card border-0 shadow-lg p-4 rounded-4 bg-white">
          <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: #4a3525">Iniciar Sesión</h2>
            <p class="text-muted small">Acceso al sistema de gestión</p>
          </div>

          <div
            id="mensajeError"
            class="alert alert-danger d-none py-2 small"
            role="alert"
          ></div>

          <form id="formLogin">
            <div class="mb-3">
              <label
                for="username"
                class="form-label fw-semibold small text-secondary"
                >Usuario</label
              >
              <input
                type="text"
                class="form-control rounded-pill px-3 py-2"
                id="username"
                required
                placeholder="Ingresá tu usuario"
              />
            </div>

            <div class="mb-4">
              <label
                for="password"
                class="form-label fw-semibold small text-secondary"
                >Contraseña</label
              >
              <input
                type="password"
                class="form-control rounded-pill px-3 py-2"
                id="password"
                required
                placeholder="Ingresá tu contraseña"
              />
            </div>

            <button
              type="submit"
              id="btnIngresar"
              class="btn w-100 rounded-pill py-2 text-white fw-semibold shadow-sm"
              style="
                background-color: #6c4f3d;
                transition: background-color 0.2s;
              "
            >
              Ingresar
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
