          />

        <div class="contenedor-h1">
          <img

        <ul class="invisible">

            <a href="#inicio">

            <a href="#info-instiucional">

          <li>
            <a href="#contacto">
              <img src="assets\phone-plus.png" alt="logo de inicio" />

            </a>
          </li>
        </ul>

    </header>
    <main>
      <!--Aca agregan el contenido de la pagina-->
    </main>

      <div class="footer-contenido">
        <div class="footer-marca">

            <img src="assets/paw.png" alt="Logo de Veterinaria La Mary" />
            <h2>Veterinaria La Mary</h2>
          </div>

        </div>

        <div class="footer-navegacion">
          <h3>Navegación</h3>
          <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#info-instiucional">Institucional</a></li>
            <li><a href="#contacto">Contacto</a></li>
          </ul>

      <div class="footer-separador"></div>

      <div class="footer-inferior">
        <p>© 2026 Veterinaria La Mary</p>
        <p>Trabajo Final Integrador — UNER</p>
